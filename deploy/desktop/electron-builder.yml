appId: com.lxserver.desktop
productName: 洛洛雪音乐
copyright: "Copyright © 2026 yahyaoo"

# 覆盖 package.json 的 main 字段，让 Electron 使用 deploy/desktop/main.js 而非 index.js
extraMetadata:
  main: deploy/desktop/main.js
  description: 洛洛雪音乐桌面端

# 后端在随包 Node 运行时中执行；依赖由 desktop.cjs 按 Node ABI 准备。
npmRebuild: false
publish: []

directories:
  output: dist-electron

# 打包进 asar 的文件（排除源码、Docker、开发工具等）
files:
  - dist/server/**/*
  - client/**/*
  - deploy/node/start.cjs
  - index.js
  - config.js
  - package.json
  - deploy/desktop/main.js
  - deploy/desktop/*-main.cjs
  - deploy/desktop/backend-process.cjs
  - deploy/client/gateway.cjs
  - deploy/desktop/icons/**/*
  - "!server"
  - "!scripts"
  - "!docs"
  - "!md"
  - "!logs"
  - "!data"
  - "!cache"
  - "!*.ts"
  - "!tsconfig.json"
  - "!ecosystem.config.js"
  - "!Dockerfile*"
  - "!docker-compose*"
  - "!.github"
  - "!electron-builder.yml"

# 原生 .node 文件必须解压到 asar 外部才能被 Node.js 加载
asarUnpack:
  - node_modules/music-tag-native/**/*
  - node_modules/bufferutil/**/*
  - node_modules/utf-8-validate/**/*
  - node_modules/better-sqlite3/**/*
  - client/**/*

# 独立 Node 子进程不能读取 Electron asar；后端与原生依赖作为外部资源交付。
extraResources:
  - from: backend
    to: backend
    filter: '**/*'

# 应用图标（提供 512x512 PNG，electron-builder 自动生成 ico / icns）
icon: deploy/desktop/icons/icon.png

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  icon: deploy/desktop/icons/icon.ico
  # 统一命名：文件名会根据架构自动变化，例如：洛洛雪音乐 1.8.0 x64.exe
  artifactName: "${productName} ${version} ${arch}.${ext}"
  target:
    # ── 独立架构安装包 ──
    - nsis
    # ── 便携绿色版 (分架构) ──
    - portable
  requestedExecutionLevel: asInvoker

nsis:
  artifactName: "${productName} ${version} ${arch} Setup.${ext}"
  installerIcon: deploy/desktop/icons/icon.ico
  uninstallerIcon: deploy/desktop/icons/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "洛洛雪音乐"

portable:
  artifactName: "${productName} ${version} ${arch} Portable.${ext}"

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  # 统一命名文件名
  artifactName: "${productName} ${version} ${arch}.${ext}"
  target:
    # 产生独立架构镜像 (x64 和 arm64 分开)
    - dmg
  category: public.app-category.utilities

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  maintainer: yahyaoo
  # 统一命名文件名
  artifactName: "${productName} ${version} ${arch}.${ext}"
  target:
    # 为三个主流 Linux 架构创建独立包 (deb 和 AppImage)
    - AppImage
    - deb
  category: Utility
