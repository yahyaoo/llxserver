# 仓库根目录执行 docker compose -f deploy/docker/compose.yaml up -d --build。 @author yahyaoo
services:
  llxserver:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: all
    restart: unless-stopped
    ports:
      - "9527:9527"
    volumes:
      - ${LLX_DATA_PATH:-../../data}:/app/data
    environment:
      DISABLE_TELEMETRY: "true"
