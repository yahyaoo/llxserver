name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*-snapshot.*'
  workflow_call:
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
  # 使用 github.repository_owner 获取用户名，并指定镜像名为 llxserver
  IMAGE_NAME: ${{ github.repository_owner }}/llxserver
  # Docker Hub 仓库名
  DOCKER_HUB_REPO: ${{ secrets.DOCKER_USERNAME }}/llxserver

jobs:
  build_and_push:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: all
            suffix: ''
            dockerfile: deploy/docker/Dockerfile
            target: all
          - mode: server
            suffix: '-server'
            dockerfile: deploy/docker/Dockerfile
            target: server
          - mode: client
            suffix: '-client'
            dockerfile: deploy/docker/client.Dockerfile
            target: ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select release or snapshot image tag
        run: node deploy/scripts/docker-tags.cjs

      - name: Test snapshot tag rules
        run: node --test test/dockerSnapshot.test.cjs

      # Add QEMU for multi-platform build
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.IS_SNAPSHOT != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
            name=${{ env.DOCKER_HUB_REPO }}${{ matrix.suffix }},enable=${{ env.IS_SNAPSHOT != 'true' }}
          tags: |
            type=raw,value=latest,enable=${{ env.IS_SNAPSHOT != 'true' }}
            type=raw,value=${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=洛洛雪音乐
            org.opencontainers.image.licenses=Apache-2.0


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          # Enable multi-platform build
          # Node 24 官方 Debian 镜像支持这两种架构，不提供 ARMv7。
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=llxserver-${{ matrix.mode }}
          cache-to: type=gha,mode=max,scope=llxserver-${{ matrix.mode }}
