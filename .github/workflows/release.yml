name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - '!v*-snapshot.*'
      - '!v*-desktop'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify merged release source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$GITHUB_REF" == refs/tags/* ]]
          git merge-base --is-ancestor HEAD origin/main
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + p.version || !/^\d+\.\d+\.\d+$/.test(p.version)) throw new Error("正式标签与源码版本不一致")'
          test -f "deploy/fnos/releases/$RELEASE_TAG.md"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild better-sqlite3
      - name: Build current source
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: HTTP, SQLite and ZIP system tests
        run: npm run test:system
      - name: FPK packaging tests
        run: npm run test:fpk
      - name: Download verified official fnpack
        run: |
          curl --fail --location --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  $RUNNER_TEMP/fnpack" | sha256sum --check
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "FNPACK_BIN=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"
      - name: Package all deployment modes
        run: |
          for mode in all server client; do
            node deploy/scripts/package.cjs "$mode"
            node -e 'const path = require("node:path"); const { preparePayload, ROOT } = require("./deploy/fnos/scripts/build.js"); const mode = process.argv[1]; preparePayload(ROOT, path.join(ROOT, "deploy/fnos", "llxserver." + mode), mode)' "$mode"
            node deploy/fnos/scripts/package.js "$mode"
          done
      - name: Actual FPK system tests
        run: npm run test:fpk:system
      - name: Collect versioned packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mkdir -p output/release
          for mode in all server client; do
            cp "output/llxserver-$mode.zip" "output/release/llxserver-$mode-$RELEASE_TAG.zip"
            cp "deploy/fnos/dist/llxserver.$mode-$RELEASE_TAG.fpk" output/release/
          done
          printf 'channel=release\ntag=%s\ncommit=%s\nrun=https://github.com/%s/actions/runs/%s\n' "$RELEASE_TAG" "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > output/release/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-node-packages
          path: output/release/*
          if-no-files-found: error

  build_desktop:
    needs: packages
    uses: ./.github/workflows/electron-build.yml
    secrets: inherit

  publish:
    needs: [packages, build_desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true
      - name: Prepare checksums and verify source
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          directory = Path('release_assets')
          files = sorted(p for p in directory.iterdir() if p.is_file())
          if not any(p.suffix == '.fpk' for p in files):
              raise RuntimeError('缺少飞牛安装包')
          (directory / 'SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files), encoding='utf-8')
          PY
          (cd release_assets && sha256sum --check SHA256SUMS)
      - name: Create draft and upload all packages
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "洛洛雪音乐 $RELEASE_TAG" --notes-file "deploy/fnos/releases/$RELEASE_TAG.md" release_assets/*
      - name: Verify uploaded bytes and publish
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release.json"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/verified-assets" --pattern '*'
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          release = json.loads(Path(sys.argv[1]).read_text())
          assert release['draft'] and not release['prerelease']
          assets = {a['name']: a for a in release['assets']}
          files = list(Path('release_assets').iterdir())
          assert set(assets) == {p.name for p in files}
          for path in files:
              asset = assets[path.name]
              assert asset['size'] == path.stat().st_size, path.name
              assert asset['digest'] == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest(), path.name
              downloaded = Path(os.environ['RUNNER_TEMP']) / 'verified-assets' / path.name
              assert hashlib.sha256(downloaded.read_bytes()).digest() == hashlib.sha256(path.read_bytes()).digest(), path.name
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
