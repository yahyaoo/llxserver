name: Build and Release

on:
  workflow_dispatch:

jobs:
  # ── 1. 初始化阶段：获取版本号和更新日志 ──────────────────────────────────────
  init:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from config
        id: get_version
        run: |
          VERSION=$(grep "version:" client/js/config.js | sed "s/.*'\(.*\)'.*/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Get Release Notes
        run: |
          awk '/^## v/ {if (p) exit; p=1} p' changelog.md > RELEASE_NOTES.md || cp changelog.md RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "---" >> RELEASE_NOTES.md
          echo "* 本次版本由 @yahyaoo 维护构建 🚀" >> RELEASE_NOTES.md

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: RELEASE_NOTES.md

  # ── 2. 桌面端构建阶段：复用 electron-build 逻辑 ──────────────────────────────
  build_desktop:
    needs: init
    strategy:
      fail-fast: false
      matrix:
        mode: [all, server, client]
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    name: Build Desktop (${{ matrix.platform }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libasound2t64

      - name: Install dependencies
        run: npm ci

      # 各角色交付目录使用独立 Node 运行时准备后端原生依赖。

      - name: Build JS source
        run: npm run electron:build

      - name: Package Electron app
        run: node deploy/scripts/desktop.cjs ${{ matrix.mode }} --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 复用我们之前调试好的分项目上传逻辑
      - name: Win x64 Setup
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-win-x64-Setup
          path: dist-electron/${{ matrix.mode }}/*x64 Setup.exe

      - name: Win x86 Setup
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-win-x86-Setup
          path: dist-electron/${{ matrix.mode }}/*ia32 Setup.exe

      - name: Win arm64 Setup
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-win-arm64-Setup
          path: dist-electron/${{ matrix.mode }}/*arm64 Setup.exe

      - name: Win x64 Portable
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-win-x64-Portable
          path: dist-electron/${{ matrix.mode }}/*x64 Portable.exe

      - name: Win x86 Portable
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-win-x86-Portable
          path: dist-electron/${{ matrix.mode }}/*ia32 Portable.exe

      - name: Win arm64 Portable
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-win-arm64-Portable
          path: dist-electron/${{ matrix.mode }}/*arm64 Portable.exe

      - name: Mac x64 DMG
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-mac-x64-dmg
          path: dist-electron/${{ matrix.mode }}/*x64.dmg

      - name: Mac arm64 DMG
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-mac-arm64-dmg
          path: dist-electron/${{ matrix.mode }}/*arm64.dmg

      - name: Linux amd64 AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-linux-amd64-AppImage
          path: dist-electron/${{ matrix.mode }}/*x64.AppImage

      - name: Linux arm64 AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-linux-arm64-AppImage
          path: dist-electron/${{ matrix.mode }}/*arm64.AppImage

      - name: Linux armv7l AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-linux-armv7l-AppImage
          path: dist-electron/${{ matrix.mode }}/*armv7l.AppImage

      - name: Linux amd64 Deb
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-linux-amd64-deb
          path: dist-electron/${{ matrix.mode }}/*amd64.deb

      - name: Linux arm64 Deb
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-linux-arm64-deb
          path: dist-electron/${{ matrix.mode }}/*arm64.deb

      - name: Linux armv7l Deb
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-${{ matrix.mode }}-linux-armv7l-deb
          path: dist-electron/${{ matrix.mode }}/*armv7l.deb

  # ── 3. 服务端构建阶段：打包 Server Zip ──────────────────────────────────────
  build_server:
    needs: init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and Build
        run: |
          npm ci
          node deploy/scripts/download-binary.js --all
          npm run build
          # 清理开发依赖，仅保留生产运行环境
          rm -rf node_modules
          npm ci --omit=dev

      - name: Build and Zip Server
        run: |
          npm run package:all
          npm run package:server
          npm run package:client

      - name: Upload Server Zip
        uses: actions/upload-artifact@v4
        with:
          name: llxserver-node-packages
          path: output/*.zip

  # ── 4. 发布阶段：汇总所有产物并创建 Release ──────────────────────────────────
  publish:
    needs: [init, build_desktop, build_server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.init.outputs.VERSION }}
          name: 洛洛雪音乐 ${{ needs.init.outputs.VERSION }}
          body_path: release_assets/RELEASE_NOTES.md
          files: |
            release_assets/*.exe
            release_assets/*.dmg
            release_assets/*.AppImage
            release_assets/*.deb
            release_assets/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
